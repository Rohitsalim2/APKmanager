name: Build Flutter APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - name: Generate Android project
        run: flutter create . --platforms=android

      - name: Force compileSdk 36 on EVERY gradle project (incl. plugins)
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/force-compilesdk.gradle" <<'EOF'
          allprojects { p ->
              p.afterEvaluate {
                  def ext = p.extensions.findByName('android')
                  if (ext != null) {
                      try { ext.compileSdkVersion(36) } catch (Exception e) { }
                      try { ext.compileSdk = 36 } catch (Exception e) { }
                      println "[" + p.name + "] compileSdk => 36"
                  }
              }
          }
          EOF
          echo "--- init script written ---"
          cat "$HOME/.gradle/init.d/force-compilesdk.gradle"

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-file-manager
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Show APK info
        run: |
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          echo "APK size: $(du -h build/app/outputs/flutter-apk/app-release.apk | cut -f1)"
